set.quoteCancel);if(slot)slot.innerHTML='';return}if(b.dataset.quoteSend){let id=b.dataset.quoteSend,o=s.orders.find(x=>x.id===id),price=Number(document.getElementById('quote-price-'+id)?.value),eta=document.getElementById('quote-eta-'+id)?.value.trim();if(!o||!Number.isFinite(price)||price<=0||!eta){say('Enter a quote price and ready estimate.');return}o.quote=price;o.amount=price;o.eta=eta;o.status='Quoted';persist();say('Quote sent · the customer can accept or decline it');return}if(b.dataset.saveCost){let o=s.orders.find(x=>x.id===b.dataset.saveCost),input=document.getElementById('cost-'+b.dataset.saveCost);if(o&&input){o.costAmount=Math.max(0,Number(input.value)||0);persist();say('Job cost saved')}return}if(b.id==='theme'){s.theme=s.theme==='dark'?'light':'dark';persist();return}if(b.dataset.cat){cat=b.dataset.cat;renderAppScreen();return}if(b.dataset.view){view=b.dataset.view;renderAppScreen();return}if(b.dataset.removePhoto!==undefined){const m=shop();if(m){m.gallery.splice(Number(b.dataset.removePhoto),1);persist()}return}if(b.dataset.save){if(!s.saved.includes(b.dataset.save)&&s.saved.length>=50){say('You can follow up to 50 makers.');return}s.saved=s.saved.includes(b.dataset.save)?s.saved.filter(x=>x!==b.dataset.save):[...s.saved,b.dataset.save];persist();return}if(b.dataset.order){openOrder(b.dataset.order,b.dataset.service);return}if(b.dataset.map){pinId=b.dataset.map;view='map';renderAppScreen();document.getElementById('makers')?.scrollIntoView({behavior:'smooth'});return}if(b.dataset.pin){pinId=b.dataset.pin;renderAppScreen();return}if(b.dataset.scroll){document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}if(b.dataset.action==='logout'){askLogout();return}if(b.dataset.action==='database'){openDatabase();return}if(b.dataset.action==='kyc'){openKyc(b.dataset.maker||shop()?.id);return}if(b.dataset.action==='carousel-pause'){heroPaused=!heroPaused;b.textContent=heroPaused?'▶':'Ⅱ';b.setAttribute('aria-label',heroPaused?'Play
